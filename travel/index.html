<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel — 2026 France + Italy</title>
<style>
  :root { --ink:#2b2521; --muted:#6f6259; --accent:#b4573f; --line:#e2d8cd; --paper:#faf7f2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family:"PingFang SC","Hiragino Sans GB","Source Han Sans SC",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;
         line-height:1.7; padding:48px 22px 80px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-family:"Songti SC","Source Han Serif SC",Georgia,serif; font-size:30px; font-weight:600;
       letter-spacing:.02em; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:13.5px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:36px; }
  .trip { display:block; text-decoration:none; color:inherit; border:1px solid var(--line);
          border-radius:10px; padding:22px 24px; background:#fff; margin-bottom:14px;
          transition:border-color .15s ease, transform .15s ease; }
  .trip:hover { border-color:var(--accent); transform:translateY(-1px); }
  .trip .yr { color:var(--accent); font-size:12px; letter-spacing:.14em; font-weight:600; }
  .trip h2 { font-family:"Songti SC","Source Han Serif SC",Georgia,serif; font-size:21px; font-weight:600; margin:4px 0 6px; }
  .trip p { margin:0; color:var(--muted); font-size:13.5px; }
  .links { margin-top:12px; font-size:13px; }
  .links a { color:var(--accent); text-decoration:none; margin-right:18px; border-bottom:1px solid rgba(180,87,63,.3); }
  .links a:hover { border-bottom-color:var(--accent); }
  footer { margin-top:34px; color:var(--muted); font-size:12px; }
  @media (max-width:520px){ body{padding:32px 16px 60px} h1{font-size:25px} .trip{padding:18px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>行前笔记</h1>
  <div class="sub">Travel notes</div>

  <a class="trip" href="2026-france-italy/">
    <div class="yr">2026</div>
    <h2>France + Italy</h2>
    <p>巴黎 · 尼斯 · 罗马 · 佛罗伦萨 · 米兰 —— 11 月 14–27 日</p>
    <div class="links"><span>行程历史文化预览 · 五座城市地图</span></div>
  </a>

  <footer>地图数据 © OpenStreetMap contributors</footer>
</div>
</body>
</html>
